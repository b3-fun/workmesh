name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Every workspace: site + relay Worker, CLI, core, protocol, and the hub (its four tsconfigs).
      - name: Typecheck
        run: npm run typecheck

      # Every workspace's vitest (the hub's run in workerd via @cloudflare/vitest-plugin) + the Worker units.
      - name: Test
        run: npm test

      - name: Build worker + site
        run: npm run build

      - name: Build CLI
        run: npm run build -w @b3os/workmesh

      # The hub deploys by hand for now (CONTRIBUTING.md); CI only proves the board builds.
      - name: Build hub board
        run: npm run build -w @workmesh/hub
