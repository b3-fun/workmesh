<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <title>Bullpen</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The console's theme bootstrap (b3os-beta lib/theme-bootstrap.ts): ?theme=, then the saved choice, else light. -->
    <script>(function(){try{var d=document.documentElement,q=new URLSearchParams(location.search).get("theme"),s=localStorage.getItem("b3os-theme"),m=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light",t=q==="dark"||q==="light"?q:s==="dark"||s==="light"?s:s==="system"?m:"light";d.setAttribute("data-theme",t)}catch(e){}})();</script>
  </head>
  <body class="bg-bg font-sans text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
