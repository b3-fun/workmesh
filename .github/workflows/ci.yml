name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Every workspace: site + relay Worker, CLI, core, protocol. (The hosted hub has its own CI, in workmesh-cloud.)
      - name: Typecheck
        run: npm run typecheck

      # Every workspace's vitest (CLI, core, protocol) + the Worker units.
      - name: Test
        run: npm test

      - name: Build worker + site
        run: npm run build

      - name: Build CLI
        run: npm run build -w @b3os/workmesh

      # docs/reference/cli.md and mcp-tools.md are generated from the built CLI; config.md must name every config key
      # and WORKMESH_* variable. Fix a failure with `npm run docs:ref` and commit the result.
      - name: Reference docs match the code
        run: npm run docs:ref:check

  # First-run onboarding on fresh Linux boxes (scripts/smoke-linux): `workmesh init` with Node 20, 22 and 24 in
  # containers without systemd, against a stand-in hub. The systemd-over-SSH box and a real hub run locally
  # (scripts/smoke-linux/smoke.sh without --fake-hub).
  smoke-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Smoke test (Linux, no systemd, Node 20/22/24)
        run: scripts/smoke-linux/smoke.sh --fake-hub --no-systemd --nodes "20 22 24"
